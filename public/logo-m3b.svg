<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp rendering -->
    <filter id="crispShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Group for entire emblem -->
  <g filter="url(#crispShadow)">
    <!-- Yellow Outer Scalloped Border (Madrasah / Kemenag 5-petaled emblem) -->
    <!-- The outer path forms the 5 curved petals with golden yellow fill -->
    <path 
      d="M 400 20 
         C 425 20, 455 50, 500 75
         C 545 100, 590 120, 610 160
         C 630 200, 610 245, 630 290
         C 650 335, 700 370, 690 415
         C 680 460, 635 485, 620 530
         C 605 575, 625 625, 590 660
         C 555 695, 500 685, 460 715
         C 420 745, 415 780, 400 780
         C 385 780, 380 745, 340 715
         C 300 685, 245 695, 210 660
         C 175 625, 195 575, 180 530
         C 165 485, 120 460, 110 415
         C 100 370, 150 335, 170 290
         C 190 245, 170 200, 190 160
         C 210 120, 255 100, 300 75
         C 345 50, 375 20, 400 20 Z" 
      fill="#FFDD00" 
      stroke="#FFD000" 
      stroke-width="4"
    />

    <!-- Inner Green Scalloped Fill -->
    <path 
      d="M 400 45 
         C 422 45, 448 72, 488 95
         C 528 118, 568 135, 586 172
         C 604 208, 586 248, 604 290
         C 622 330, 668 362, 658 402
         C 648 444, 608 466, 594 508
         C 580 550, 598 595, 568 626
         C 536 658, 488 648, 452 676
         C 416 704, 412 752, 400 752
         C 388 752, 384 704, 348 676
         C 312 648, 264 658, 232 626
         C 202 595, 220 550, 206 508
         C 192 466, 152 444, 142 402
         C 132 362, 178 330, 196 290
         C 214 248, 196 208, 214 172
         C 232 135, 272 118, 312 95
         C 352 72, 378 45, 400 45 Z" 
      fill="#027D3F" 
    />
  </g>

  <!-- Top 5-Pointed Star -->
  <!-- Center at (400, 190) -->
  <polygon 
    points="400,135 417,185 470,185 427,216 443,266 400,236 357,266 373,216 330,185 383,185" 
    fill="#FFDD00"
  />

  <!-- Stylized Yellow Wings / Flames (Left & Right) -->
  <!-- Right Wing -->
  <path 
    d="M 400 405
       C 435 405, 480 395, 520 370
       C 560 345, 600 300, 615 240
       C 618 228, 605 230, 595 242
       C 565 278, 525 315, 480 325
       C 515 305, 560 270, 575 210
       C 578 198, 566 200, 555 212
       C 525 248, 485 285, 445 295
       C 435 298, 420 300, 405 302
       L 405 320
       C 440 318, 490 315, 520 280
       C 540 256, 550 220, 550 185
       C 550 172, 538 174, 528 186
       C 490 230, 440 270, 395 282
       Z" 
    fill="#FFDD00"
  />

  <!-- Left Wing (Mirrored) -->
  <path 
    d="M 400 405
       C 365 405, 320 395, 280 370
       C 240 345, 200 300, 185 240
       C 182 228, 195 230, 205 242
       C 235 278, 275 315, 320 325
       C 285 305, 240 270, 225 210
       C 222 198, 234 200, 245 212
       C 275 248, 315 285, 355 295
       C 365 298, 380 300, 395 302
       L 395 320
       C 360 318, 310 315, 280 280
       C 260 256, 250 220, 250 185
       C 250 172, 262 174, 272 186
       C 310 230, 360 270, 405 282
       Z" 
    fill="#FFDD00"
  />

  <!-- Lower Curved Wings Feathers Sweeping to Book -->
  <path 
    d="M 400 405 
       C 455 405, 535 410, 610 350
       C 625 338, 620 328, 605 336
       C 550 365, 480 380, 420 370
       C 485 390, 560 390, 625 435
       C 635 442, 630 452, 615 448
       C 555 432, 485 412, 425 415
       C 490 435, 560 450, 615 500
       C 622 506, 615 514, 602 510
       C 540 488, 470 460, 400 455
       Z"
    fill="#FFDD00"
  />
  <path 
    d="M 400 405 
       C 345 405, 265 410, 190 350
       C 175 338, 180 328, 195 336
       C 250 365, 320 380, 380 370
       C 315 390, 240 390, 175 435
       C 165 442, 170 452, 185 448
       C 245 432, 315 412, 375 415
       C 310 435, 240 450, 185 500
       C 178 506, 185 514, 198 510
       C 260 488, 330 460, 400 455
       Z"
    fill="#FFDD00"
  />

  <!-- Center White Stupa / Pagoda Monument (Pure White #FFFFFF) -->
  <g fill="#FFFFFF">
    <!-- Top Pinnacle Finial -->
    <path d="M 400 280 L 426 315 L 452 300 L 420 342 L 426 360 L 400 375 L 374 360 L 380 342 L 348 300 L 374 315 Z" />

    <!-- Top Tier 1 -->
    <path d="M 335 398 C 335 390, 345 385, 360 385 L 440 385 C 455 385, 465 390, 465 398 L 460 415 C 460 422, 450 426, 435 426 L 365 426 C 350 426, 340 422, 340 415 Z" />

    <!-- Middle Tier 2 -->
    <path d="M 320 440 C 320 432, 332 427, 350 427 L 450 427 C 468 427, 480 432, 480 440 L 475 460 C 475 468, 462 472, 445 472 L 355 472 C 338 472, 325 468, 325 460 Z" />

    <!-- Bottom Tier 3 -->
    <path d="M 305 488 C 305 480, 318 474, 340 474 L 460 474 C 482 474, 495 480, 495 488 L 490 512 C 490 522, 475 528, 452 528 L 348 528 C 325 528, 310 522, 310 512 Z" />

    <!-- Pedestal Base Under Tier 3 -->
    <path d="M 305 528 C 305 528, 320 550, 400 550 C 480 550, 495 528, 495 528 L 478 556 C 450 568, 430 572, 400 572 C 370 572, 350 568, 322 556 Z" />
  </g>

  <!-- Open Book of Knowledge (Kitab Al-Qur'an) in Golden Yellow #FFDD00 -->
  <g fill="#FFDD00">
    <!-- Left Page -->
    <path d="M 215 540 C 275 538, 345 555, 400 588 C 345 572, 275 558, 225 575 L 220 560 Z" />
    <!-- Right Page -->
    <path d="M 585 540 C 525 538, 455 555, 400 588 C 455 572, 525 558, 575 575 L 580 560 Z" />
    <!-- Main Solid Open Book Ribbon Band -->
    <path 
      d="M 225 542 
         C 290 538, 355 552, 400 585 
         C 445 552, 510 538, 575 542 
         L 570 565 
         C 510 560, 448 575, 400 610 
         C 352 575, 290 560, 230 565 
         Z" 
    />
    <!-- Center Spine Knob -->
    <circle cx="400" cy="605" r="14" />
  </g>

  <!-- Curved Text "MTsN 3 BANYUWANGI" in Arched White Sans-Serif -->
  <defs>
    <!-- Upward curved arc for the text path -->
    <path id="textArcM3B" d="M 230 655 C 310 735, 490 735, 570 655" fill="none" />
  </defs>

  <text 
    font-size="36" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    fill="#FFFFFF" 
    letter-spacing="4"
  >
    <textPath href="#textArcM3B" startOffset="50%" text-anchor="middle">
      MTsN 3 BANYUWANGI
    </textPath>
  </text>
</svg>
